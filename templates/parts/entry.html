<section id="entry" class="screen active">

    <div class="entry-scene" aria-hidden="true">

        <div class="entry-sky"></div>

        <div class="entry-stars entry-stars-back"></div>
        <div class="entry-stars entry-stars-mid"></div>
        <div class="entry-stars entry-stars-front"></div>

        <div class="entry-nebula entry-nebula-one"></div>
        <div class="entry-nebula entry-nebula-two"></div>
        <div class="entry-nebula entry-nebula-three"></div>

        <div class="entry-orbit-field">

            <div class="entry-orbit entry-orbit-a"></div>
            <div class="entry-orbit entry-orbit-b"></div>
            <div class="entry-orbit entry-orbit-c"></div>

        </div>

        <div class="entry-light-source">
            <div class="entry-light-core"></div>
            <div class="entry-light-ring"></div>
        </div>

        <div class="entry-fog entry-fog-one"></div>
        <div class="entry-fog entry-fog-two"></div>

        <div class="entry-vignette"></div>

    </div>


    <div class="entry-content">

        <div class="entry-mark-wrap">

            <div class="entry-mark-aura"></div>

            <div class="entry-mark">

                <div class="entry-mark-ring ring-one"></div>
                <div class="entry-mark-ring ring-two"></div>
                <div class="entry-mark-ring ring-three"></div>

                <div class="entry-mark-core">
                    <span></span>
                </div>

            </div>

        </div>


        <div class="entry-kicker">
            BIR KICHIK OLAM
        </div>


        <h1 class="entry-title">
            Kirish.
        </h1>


        <p class="entry-sub">
            Ba'zi joylarga shunchaki kirilmaydi.
            Ularni avval his qilish kerak.
        </p>


        <div class="entry-gate">

            <div class="entry-input-shell">

                <div class="entry-input-light"></div>

                <input
                    id="accessCode"
                    class="entry-input"
                    type="password"
                    inputmode="numeric"
                    autocomplete="off"
                    maxlength="32"
                    placeholder="Kirish kodi"
                >

            </div>


            <div
                id="entryError"
                class="entry-error"
                aria-live="polite"
            ></div>


            <button
                id="entryButton"
                class="entry-button"
                type="button"
            >
                <span class="entry-button-text">
                    Davom etish
                </span>

                <span
                    class="entry-button-arrow"
                    aria-hidden="true"
                >
                    →
                </span>

            </button>

        </div>


        <div class="entry-hint">
            <span></span>
            Faqat kodni bilganlar kiradi
            <span></span>
        </div>

    </div>


    <div class="entry-corner entry-corner-left">
        <span>01</span>
        <i></i>
    </div>

    <div class="entry-corner entry-corner-right">
        <i></i>
        <span>ENTRY</span>
    </div>

</section>
