    </button>

</div>


<nav

    class="main-menu"
    aria-hidden="true"
>

    <div class="menu-inner">

        <button
            class="menu-item"
            type="button"
            data-sheet="chat"
        >
            <span class="menu-item-title">Chat</span>
            <span
                id="chatBadge"
                class="menu-badge"

            >

        <button

            type="button"
            data-sheet="letters"

                Xatlar
            </span>
        </button>

        <button
            class="menu-item"
            type="button"
            data-sheet="worlds"
        >
            <span class="menu-item-title">
                Dunyolar

        </button>

        <button

            type="button"
            data-sheet="environment"

        </button>

        <button

        </button>

    </div>

</nav>


<div

    class="sheet-overlay"
    aria-hidden="true"
>

    <section
        id="sheet"
        class="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="sheetTitle"
    >

        <div class="sheet-head">

            <h2 id="sheetTitle">
                Bo‘lim
            </h2>

            <button
                id="sheetClose"
                class="sheet-close"
                type="button"
                aria-label="Yopish"
            >
                ×
            </button>

        </div>

        <div
            id="sheetBody"
            class="sheet-body"
        ></div>

    </section>
