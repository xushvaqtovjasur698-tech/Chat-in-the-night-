<section id="nameGate" class="screen">
    <div class="name-wrap">
        <div class="name-content">

            <div class="name-kicker">
                Endi seni tanishim kerak.
            </div>

            <h1 class="name-title">
                Isming nima?
            </h1>

            <p class="name-sub">
                Bu ism shu kichik olamda seni ifodalab turadi.
            </p>

            <div class="name-form">

                <input
                    id="nameInput"
                    class="name-input"
                    type="text"
                    autocomplete="name"
                    maxlength="40"
                    placeholder="Isming..."
                >

                <div
                    id="nameError"
                    class="name-error"
                    aria-live="polite"
                ></div>

                <button
                    id="nameButton"
                    class="name-button"
                    type="button"
                >
                    Davom etish
                </button>

            </div>

        </div>
    </div>
</section>
